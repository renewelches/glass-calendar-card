name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # re-check weekly in case an allowed dependency releases a fix
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (if any)
        run: |
          if [ -f package.json ]; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo "No package.json: the card ships with zero npm dependencies."
          fi
      - name: npm audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "No lockfile: nothing to audit. The only runtime resources are the optional Google font (see external-urls job) and your own Home Assistant."
          fi

  external-urls:
    name: Third-party URL scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/external-urls.mjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language/javascript
