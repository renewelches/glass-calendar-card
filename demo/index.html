<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Calendar Card – demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='12' width='48' height='44' rx='10' fill='%235ff3ff' opacity='.85'/%3E%3Crect x='8' y='12' width='48' height='14' rx='10' fill='%23151b2e'/%3E%3Crect x='18' y='6' width='6' height='12' rx='3' fill='%235ff3ff'/%3E%3Crect x='40' y='6' width='6' height='12' rx='3' fill='%235ff3ff'/%3E%3Ccircle cx='24' cy='40' r='5' fill='%23151b2e'/%3E%3Ccircle cx='40' cy='40' r='5' fill='%23151b2e'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, sans-serif; color: #eef4ff; padding: 32px;
    background:
      radial-gradient(900px 620px at 0% 0%, rgba(0,170,255,.26), transparent 60%),
      radial-gradient(820px 600px at 100% 6%, rgba(150,70,255,.26), transparent 60%),
      radial-gradient(900px 700px at 60% 110%, rgba(0,255,170,.14), transparent 60%), #000;
  }
  body.light { color: #1c2433; background: radial-gradient(900px 620px at 0% 0%, rgba(0,170,255,.25), transparent 60%), radial-gradient(820px 600px at 100% 6%, rgba(150,70,255,.18), transparent 60%), #e9eef6; }
  .wrap { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .slot { width: var(--w, 860px); }
  .shot body, body.shot { padding: 24px; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
/* A tiny stand-in for Home Assistant's <ha-icon>, using the Material Design Icons webfont (demo only). */
const MDI = 'https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css';
document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="' + MDI + '">');
customElements.define('ha-icon', class extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  constructor() { super(); this.attachShadow({ mode: 'open' }); }
  connectedCallback() { this._r(); }
  attributeChangedCallback() { this._r(); }
  set icon(v) { this.setAttribute('icon', v); }
  _r() {
    const name = String(this.getAttribute('icon') || '').replace('mdi:', '');
    this.shadowRoot.innerHTML = '<link rel="stylesheet" href="' + MDI + '">' +
      '<style>:host{display:inline-flex;align-items:center;justify-content:center;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}' +
      'i{font-size:var(--mdc-icon-size,24px);line-height:1}</style><i class="mdi mdi-' + name + '"></i>';
  }
});
customElements.define('ha-card', class extends HTMLElement {});

/* --- minimal ha-form mock (demo only): renders schema items as plain fields, fires value-changed with the full data object */
customElements.define('ha-form', class extends HTMLElement {
  constructor() {
    super(); this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = '<style>:host{display:block}.f{margin:8px 0}.f label{display:block;font-size:12px;opacity:.7;margin-bottom:3px}.grid{display:flex;flex-wrap:wrap;gap:8px}.grid .f{flex:1;min-width:120px}input,select{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid rgba(128,128,128,.5);border-radius:8px;background:transparent;color:inherit}</style><div id="root"></div>';
  }
  set hass(v) { this._hass = v; }
  get hass() { return this._hass; }
  set schema(v) { this._schema = v || []; this._data = this._data || {}; this._render(); }
  get schema() { return this._schema; }
  set data(v) { this._data = Object.assign({}, v); this._render(); }
  get data() { return this._data; }
  computeLabel(s) { return s.title || s.name; }
  computeHelper(s) { return ''; }
  _emit() { this.dispatchEvent(new CustomEvent('value-changed', { detail: { value: this._data } })); }
  _field(it, container) {
    const wrap = document.createElement('div'); wrap.className = 'f';
    const lab = document.createElement('label'); lab.textContent = this.computeLabel(it); wrap.appendChild(lab);
    const sel = it.selector || {};
    let input;
    if (sel.entity) {
      input = document.createElement('input');
      const cur = this._data[it.name];
      input.value = Array.isArray(cur) ? cur.join(', ') : (cur || '');
      input.placeholder = 'calendar. …';
      input.addEventListener('input', () => {
        const v = input.value.trim();
        if (sel.entity.multiple) this._data[it.name] = v ? v.split(',').map((x) => x.trim()).filter(Boolean) : [];
        else this._data[it.name] = v;
        this._emit();
      });
    } else if (sel.select) {
      input = document.createElement('select');
      (sel.select.options || []).forEach((o) => { const op = document.createElement('option'); op.value = (typeof o === 'object' ? (o.value || o.label) : o); op.textContent = (typeof o === 'object' ? (o.label || o.value) : o); input.appendChild(op); });
      input.value = String(this._data[it.name] != null ? this._data[it.name] : input.selectedOptions?.[0]?.value || '');
      if (input.selectedIndex < 0 && input.options.length) input.selectedIndex = 0;
      input.addEventListener('change', () => { this._data[it.name] = input.value; this._emit(); });
    } else if (sel.number) {
      input = document.createElement('input'); input.type = 'number';
      if (sel.number.min != null) input.min = sel.number.min;
      if (sel.number.max != null) input.max = sel.number.max;
      if (sel.number.step != null) input.step = sel.number.step;
      input.value = this._data[it.name] != null ? this._data[it.name] : (sel.number.default ?? '');
      input.addEventListener('input', () => { if (input.value !== '') this._data[it.name] = Number(input.value); this._emit(); });
    } else if (sel.color_rgb) {
      input = document.createElement('input'); input.type = 'color';
      const c = this._data[it.name] || [0, 0, 0];
      input.value = '#' + c.slice(0, 3).map((x) => Number(x).toString(16).padStart(2, '0')).join('');
      input.addEventListener('input', () => { const h = input.value; this._data[it.name] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; this._emit(); });
    } else if (sel.ui_action) {
      input = document.createElement('input'); input.value = String(this._data[it.name] || ''); input.placeholder = 'action';
      input.addEventListener('input', () => { this._data[it.name] = input.value; this._emit(); });
    } else {
      input = document.createElement('input');
      input.value = this._data[it.name] != null ? this._data[it.name] : '';
      input.addEventListener('input', () => { this._data[it.name] = input.value; this._emit(); });
    }
    wrap.appendChild(input); container.appendChild(wrap);
  }
  _render() {
    const root = this.shadowRoot.getElementById('root');
    root.innerHTML = '';
    this._data = this._data || {};
    const walk = (items, container) => {
      (items || []).forEach((it) => {
        if (it.type === 'expandable') {
          const box = document.createElement('details'); box.open = it.expanded !== false;
          const sum = document.createElement('summary'); sum.textContent = it.title || it.name || '…'; sum.style.cssText = 'cursor:pointer;font-weight:600;margin:6px 0';
          box.appendChild(sum);
          const inner = document.createElement('div'); box.appendChild(inner);
          container.appendChild(box);
          walk(it.schema, inner);
        } else if (it.type === 'grid') {
          const g = document.createElement('div'); g.className = 'grid';
          container.appendChild(g);
          walk(it.schema, g);
        } else this._field(it, container);
      });
    };
    walk(this._schema, root);
  }
});

/* --- minimal ha-expansion-panel mock (demo only) */
customElements.define('ha-expansion-panel', class extends HTMLElement {
  constructor() {
    super();
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML = '<style>:host{display:block}details{border:1px solid rgba(128,128,128,.5);border-radius:12px;margin:8px 0}summary{cursor:pointer;padding:12px;font-weight:600}</style><details open><summary id="h"></summary><slot></slot></details>';
  }
  set header(v) { this.shadowRoot.getElementById('h').textContent = v; }
  get header() { return this.shadowRoot.getElementById('h').textContent; }
  set outlined(v) {}
  set expanded(v) { this.shadowRoot.querySelector('details').open = !!v; }
  get expanded() { return this.shadowRoot.querySelector('details').open; }
});

const Q = new URLSearchParams(location.search);
const lang = Q.get('lang') || 'en';
const light = Q.get('theme') === 'light';
if (light) document.body.classList.add('light');
if (Q.get('shot')) document.body.classList.add('shot');

/* optional fixed time for screenshots: ?time=10:24 */
if (Q.get('time')) {
  const [H, M] = Q.get('time').split(':').map(Number);
  const RealDate = Date, base = new RealDate(); base.setHours(H, M, 24, 0);
  const offset = base.getTime() - RealDate.now();
  window.Date = class extends RealDate {
    constructor(...a) { if (a.length) super(...a); else super(RealDate.now() + offset); }
    static now() { return RealDate.now() + offset; }
  };
}

const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dt = (n, h, m) => { const d = day(n); d.setHours(h, m || 0, 0, 0); return d.toISOString(); };

const de = lang === 'de';
const it = lang === 'it';
const ds = (n) => ({ date: ymd(day(n)) });                     // all-day event on day +n
const dts = (n, h, m) => ({ dateTime: dt(n, h, m || 0) });     // timed event on day +n
const ev = (summary, s, e, location, hidden) => ({ summary, start: s, end: e, location, hidden });
const events = [
  de ? ev('Gelber Sack ab 6 Uhr', ds(0), ds(1)) : it ? ev('Raccolta Plastica', ds(0), ds(1)) : ev('Yellow bag', ds(0), ds(1)),
  de ? ev('Zahnarzt', dts(0, 9, 30), dts(0, 11, 30), 'Dr. Meier, Hauptstr. 12') : it ? ev('Dentista', dts(0, 9, 30), dts(0, 11, 30), 'Via Roma 1') : ev('Dentist', dts(0, 9, 30), dts(0, 11, 30), '12 Main St'),
  de ? ev('Papier', ds(1), ds(2)) : it ? ev('Carta e cartone', ds(1), ds(2)) : ev('Paper & cardboard', ds(1), ds(2)),
  de ? ev('Fußball', dts(1, 19, 0), dts(1, 21, 0), 'Sportplatz') : it ? ev('Calcio', dts(1, 19, 0), dts(1, 21, 0), 'Stadio') : ev('Soccer practice', dts(1, 19, 0), dts(1, 21, 0), 'Stadium'),
  de ? ev('Team-Meeting', dts(2, 8, 30), dts(2, 10, 0), 'Konferenzraum A') : it ? ev('Riunione', dts(2, 8, 30), dts(2, 10, 0), 'Sala A') : ev('Team meeting', dts(2, 8, 30), dts(2, 10, 0), 'Room A'),
  de ? ev('Glas', ds(3), ds(4)) : it ? ev('Vetro', ds(3), ds(4)) : ev('Glass', ds(3), ds(4)),
  de ? ev('Geburtstag Anna 🎂', ds(4), ds(5)) : it ? ev('Compleanno Anna 🎂', ds(4), ds(5)) : ev("Anna's birthday 🎂", ds(4), ds(5)),
  de ? ev('Restmüll', ds(6), ds(7)) : it ? ev('Indifferenziato', ds(6), ds(7)) : ev('General waste', ds(6), ds(7)),
  ev(de ? 'Versteckt' : 'Hidden event', dts(1, 12, 0), dts(1, 13, 0), null, true)
];

const holidayEvents = [
  de ? ev('Tag der Arbeit', ds(3), ds(4)) : it ? ev('Festa nazionale', ds(3), ds(4)) : ev('National holiday', ds(3), ds(4)),
  de ? ev('Winterferien beginnen', ds(6), ds(7)) : it ? ev('Inizio vacanze invernali', ds(6), ds(7)) : ev('Winter break starts', ds(6), ds(7))
];

const hass = {
  language: lang, locale: { language: lang, time_format: Q.get('h12') ? '12' : 'language' },
  themes: { darkMode: !light },
  config: { latitude: 45.46, longitude: 9.19, unit_system: { temperature: '°C' } },
  localize: () => '',
  states: {
    'calendar.household': { entity_id: 'calendar.household', state: '2', attributes: { friendly_name: de ? 'Haushalt' : it ? 'Casa' : 'Household', calendar: 'google' } },
    'calendar.holidays': { entity_id: 'calendar.holidays', state: '1', attributes: { friendly_name: de ? 'Feiertage' : it ? 'Feste' : 'Holidays', calendar: 'builtin' } },
    'calendar.team': { entity_id: 'calendar.team', state: 'off', attributes: { friendly_name: 'Office & Team' } },
    'sensor.office': { entity_id: 'sensor.office', state: 'on', attributes: { friendly_name: 'Office', domain: 'calendar' } }
  },
  callApi: (method, path) => {
    const which = String(path).split('/')[1].split('?')[0];
    return Promise.resolve(which === 'calendar.holidays' ? holidayEvents : events);
  }
};

const types = de
  ? [{ pattern: 'Gelb', label: 'Gelber Sack', icon: 'mdi:bottle-soda-classic-outline', color: [255, 198, 64] },
     { pattern: 'Papier', label: 'Papier', icon: 'mdi:newspaper-variant-outline', color: [96, 165, 250] },
     { pattern: 'Glas', label: 'Glas', icon: 'mdi:glass-fragile', color: [92, 210, 200] },
     { pattern: 'Rest', label: 'Restmüll', icon: 'mdi:trash-can-outline', color: [170, 182, 200] }]
  : it
  ? [{ pattern: 'Plastica', label: 'Plastica', icon: 'mdi:bottle-soda-classic-outline', color: [255, 198, 64] },
     { pattern: 'Carta', label: 'Carta', icon: 'mdi:newspaper-variant-outline', color: [96, 165, 250] },
     { pattern: 'Vetro', label: 'Vetro', icon: 'mdi:glass-fragile', color: [92, 210, 200] },
     { pattern: 'Indifferenziat', label: 'Indifferenziato', icon: 'mdi:trash-can-outline', color: [170, 182, 200] }]
  : [{ pattern: 'Yellow', label: 'Yellow bag', icon: 'mdi:bottle-soda-classic-outline', color: [255, 198, 64] },
     { pattern: 'Paper', label: 'Paper', icon: 'mdi:newspaper-variant-outline', color: [96, 165, 250] },
     { pattern: 'Glass', label: 'Glass', icon: 'mdi:glass-fragile', color: [92, 210, 200] },
     { pattern: 'General', label: 'General waste', icon: 'mdi:trash-can-outline', color: [170, 182, 200] }];

const base = {
  type: 'custom:glass-calendar-card', entities: ['calendar.household', 'calendar.holidays'],
  days: 7, max_events: 8, show_location: true, default_icon: 'mdi:calendar-star', calendar_types: types
};
const extra = Q.get('config') ? JSON.parse(Q.get('config')) : {};
const widths = (Q.get('w') || '860').split(',');

const s = document.createElement('script');
s.src = '../dist/glass-calendar-card.js';
s.onload = () => {
  widths.forEach((w) => {
    const slot = document.createElement('div'); slot.className = 'slot'; slot.style.setProperty('--w', w + 'px');
    const card = document.createElement('glass-calendar-card');
    card.setConfig(Object.assign({}, base, extra));
    slot.appendChild(card); document.getElementById('wrap').appendChild(slot);
    card.hass = hass;
  });
  /* visual editor demo */
  const eslot = document.createElement('div'); eslot.className = 'slot'; eslot.style.setProperty('--w', '520px');
  const label = document.createElement('p'); label.style.cssText = 'opacity:.7;font-size:13px'; label.textContent = 'Visual editor (glass-calendar-card-editor):';
  const ed = document.createElement('glass-calendar-card-editor');
  eslot.appendChild(label); eslot.appendChild(ed);
  document.getElementById('wrap').appendChild(eslot);
  ed.config = Object.assign({}, base);
  ed.hass = hass;
  if (Q.get('autotest')) {
    queueMicrotask(async () => {
      try {
        const root = ed.shadowRoot;
        const inp = root.getElementById('pick');
        const results = root.getElementById('cal-results');
        const add = root.getElementById('addc');
        const error = root.getElementById('cal-error');
        const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
        const type = (value) => { inp.value = value; inp.dispatchEvent(new Event('input')); };
        const changes = [];
        ed.addEventListener('config-changed', (ev) => {
          changes.push(ev.detail.config);
          ed.setConfig(ev.detail.config);
        });
        const calendars = [{ entity: 'calendar.household', name: 'Home', color: [12, 34, 56] }];
        ed.setConfig({ ...base, calendars });

        add.click();
        assert(!results.hidden && results.querySelectorAll('button').length === 1, 'Add did not show available calendars');
        type('calendar.te');
        assert(results.querySelector('[data-entity="calendar.team"]'), 'missing entity ID match');
        type('OFFICE');
        assert(results.querySelectorAll('button').length === 1, 'expected a single calendar match by friendly name');
        const result = results.querySelector('[data-entity="calendar.team"]');
        assert(result && result.textContent.includes('Office & Team'), 'missing friendly name match');
        result.click();
        assert(changes.length === 1 && changes[0].entities.includes('calendar.team'), 'search result not added');
        assert(inp.value === '' && results.hidden, 'search not reset after adding');
        type('office');
        assert(!results.querySelector('button'), 'already selected calendar is still suggested');

        type('sensor.office');
        add.click();
        assert(changes.length === 1 && error.textContent, 'invalid input was not rejected visibly');
        type('calendar.team');
        add.click();
        assert(changes.length === 1 && error.textContent, 'duplicate input was not rejected visibly');

        type(' calendar.extra_test ');
        inp.dispatchEvent(new Event('change'));
        assert(changes.length === 1, 'typing alone unexpectedly changed the config');
        add.click();
        assert(changes.length === 2 && changes[1].entities.includes('calendar.extra_test'), 'Add button did not save calendar');
        type('calendar.keyboard');
        inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', cancelable: true }));
        assert(changes.length === 3 && changes[2].entities.includes('calendar.keyboard'), 'Enter did not save calendar');
        assert(JSON.stringify(changes[2].calendars) === JSON.stringify(calendars), 'existing calendar settings were lost');
        await Promise.resolve();
        assert(root.querySelectorAll('#cals .chip').length === 5, 'added calendars did not render');
        document.title = 'AUTOTEST PASS';
      } catch (e) { console.error(e); document.title = 'AUTOTEST_ERR ' + e.message; }
    });
  }
};
document.head.appendChild(s);
</script>
</body>
</html>
